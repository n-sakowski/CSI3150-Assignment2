<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSL-UI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">🪴</span>
          <h1>Greenhouse Sensor Logger</h1>
        </div>
        <div class="header-status">
          Logs: <span id="log-count" class="badge-count">0</span>
        </div>
      </div>
    </header>

    <main class="portal-container">
      <aside class="panel form-panel">
        <h2 class="panel-title">Add a Log:</h2>

        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          role="alert"
        ></div>

        <form action="#" id="greenhouse-form" novalidate>
          <div class="form-group">
            <label for="user-name" class="form-label">
              Full Name <span class="required">*</span>
            </label>
            <input
              type="text"
              name="user-name"
              id="user-name"
              class="form-control"
              placeholder="e.g. Eleanor Vance"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ph" class="form-label">
                pH level <span class="required">*</span>
              </label>
              <input
                type="number"
                name="ph"
                id="ph"
                class="form-control"
                min="0"
                max="14"
                placeholder="6.0"
                required
              />
            </div>
            <div class="form-group">
              <label for="ec" class="form-label">
                Electrical Conductivity (mS/cm) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="ec"
                id="ec"
                ,
                class="form-control"
                min="0"
                placeholder="1.2"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="temp" class="form-label">
                Air Temperature (°F) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                placeholder="67"
                required
              />
            </div>
            <div class="form-group">
              <label for="rh" class="form-label">
                Relative Humidity (%) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="rh"
                id="rh"
                class="form-control"
                min="0"
                max="100"
                placeholder="40"
                required
              />
            </div>
          </div>
          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Submit
          </button>
        </form>
      </aside>

      <section class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">All Logs:</h2>
          <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
            Delete All
          </button>
        </div>

        <div id="empty-state" class="empty-state">
          <span class="empty-icon">🫤</span>
          <p>Nothing</p>
        </div>

        <ul id="records-list" class="records-grid" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 CSI3150 Project 2 | Fall 2026</p>
    </footer>
  </body>
</html>
